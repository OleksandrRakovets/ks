# Declared services start on every `amp orb services ensure`; see .agents/AGENTS.md for the on-demand preview portal.
services:
  play-dev:
    command: ./node_modules/.bin/turbo watch @ks/play#dev -- --port "$PORT"
    cwd: .
    health: /
    portal:
      title: Play dev
      description: Development server with the colocated MatchRoom Durable Object.
