services:
  play-dev:
    command: ./node_modules/.bin/turbo watch @ks/play#dev -- --port "$PORT"
    cwd: .
    health: /
    portal:
      title: KS dev
      description: Development server with the colocated MatchRoom Durable Object.
  play-preview:
    command: ./node_modules/.bin/turbo run @ks/play#preview -- --port "$PORT"
    cwd: .
    health: /
    portal:
      title: KS preview
      description: Production build preview with the colocated MatchRoom Durable Object.
